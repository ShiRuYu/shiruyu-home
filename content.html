<div class="cg-wrap">
  <div class="cg-head">
    <h2>🎨 CG 画廊</h2>

    <button class="cg-refresh" id="cg-refresh">🔄 换一批</button>
  </div>
  <div id="cg-grid" class="cg-grid"></div>
  <div id="cg-lightbox" class="cg-lightbox" hidden>
    <div class="lb-backdrop"></div>
    <div class="lb-card">
      <button class="lb-close" id="lb-close">✕</button>
      <img id="lb-img" alt="CG 大图">
      <div class="lb-info">
        <span id="lb-artist">画师：-</span>
        <a id="lb-source" href="#" target="_blank" rel="noopener">pixiv 原图 ↗</a>
      </div>
    </div>
  </div>
</div>
