<div class="lt-wrap">
  <div class="lt-head">
    <h2>🎋 每日一签</h2>
    <p class="lt-sub">试试今天的手气 · 每天固定一支，次日重置</p>
  </div>

  <div class="lt-stage">
    <div class="lt-tube" id="lt-tube">🎋</div>
    <div class="lt-btns">
      <button class="lt-btn" id="lt-btn">抽 签</button>
      <button class="lt-btn ghost" id="lt-reset" hidden>明天再来</button>
    </div>
    <div id="lt-result" class="lt-result" hidden>
      <div class="lt-card">
        <div class="lt-level" id="lt-level"></div>
        <p class="lt-text" id="lt-text"></p>
        <div class="lt-date" id="lt-date"></div>
      </div>
    </div>
  </div>

  <div class="lt-history">
    <h3>📜 抽签历史</h3>
    <ul id="lt-hist"></ul>
  </div>
</div>
